title: Learn any skill, [guided by AI]{class="text-primary"}
description: Skilleate pairs every learner with AI agents that personalize your path, track your progress, and keep you moving, all supervised by real humans. Learn at your own pace, with guidance that never sleeps.
seo:
  title: 'Skilleate: learning, guided by AI agents'
  description: An online learning platform where AI agents guide your progress and mentoring, supervised by humans. For non-technical learners picking up a new skill, and professionals leveling up.
navigation: false
hero:
  links:
    - label: Start learning
      icon: i-lucide-arrow-right
      trailing: true
      to: /signup
      size: xl
    - label: See how it works
      icon: i-lucide-play
      size: xl
      color: neutral
      variant: subtle
      to: '#features'
sections:
  - title: Your own learning guide, always on
    description: Every learner gets an AI agent that tracks progress, adapts the path when something isn't clicking, and nudges you back on track. A human team supervises quality and steps in whenever it matters.
    id: features
    orientation: horizontal
    features:
      - name: Personalized progress tracking
        description: Your agent sees exactly where you are in every course and adjusts pace, review, and next steps to fit how you actually learn.
        icon: i-lucide-chart-line
      - name: Guidance, not just content
        description: Stuck on a concept? Your agent explains it a different way, points you to the right lesson, or flags it for a human mentor to review.
        icon: i-lucide-compass
      - name: Humans supervise every step
        description: Agents guide day to day. A real team oversees quality, safety, and outcomes across the platform, so it's AI-assisted, never AI-alone.
        icon: i-lucide-shield-check
  - title: Built for every kind of learner
    description: Whether you're picking up your first technical skill or a working professional sharpening one you already have, Skilleate meets you where you are.
    orientation: horizontal
    reverse: true
    features:
      - name: No experience required
        description: Clear explanations, no jargon, and an agent that adjusts when something needs a simpler path.
        icon: i-lucide-sprout
      - name: Room to go deeper
        description: Already technical? Skip the basics and let your agent route you straight to the advanced material and practice you need.
        icon: i-lucide-trending-up
      - name: Learn on your schedule
        description: Pause, resume, and switch pace anytime. Your agent picks up right where you left off, whenever that is.
        icon: i-lucide-clock
features:
  title: Everything you need to actually finish
  description: Most online courses are easy to start and easy to abandon. Skilleate's agents are built to keep you moving until you're done.
  items:
    - title: Personalized learning paths
      description: Your path adapts as you go, with more practice where you need it and less time on what you already know.
      icon: i-lucide-route
    - title: Always-available guidance
      description: Ask a question at midnight or midday. Your agent responds, and a human reviews anything that needs one.
      icon: i-lucide-message-circle-question
    - title: Progress you can see
      description: A clear dashboard shows what you've mastered, what's next, and how far you've come.
      icon: i-lucide-gauge
    - title: Skill certificates
      description: Finish a path and get a certificate that shows exactly what you learned.
      icon: i-lucide-award
    - title: Human-reviewed quality
      description: Every course and every agent interaction is supervised by our team, not left to run unchecked.
      icon: i-lucide-user-check
    - title: A skill for everyone
      description: From your first technical concept to your next professional certification, find a path built for where you're starting from.
      icon: i-lucide-users
testimonials:
  headline: Real learners, real progress
  title: Why people choose to learn with Skilleate
  description: A few examples of the kind of progress learners make when an AI agent is guiding the way, supervised by humans every step.
  items:
    - quote: I'd started three online courses before and never finished one. My agent noticed when I was stuck and changed how it explained things until it clicked. I actually finished this time.
      user:
        name: Priya Nair
        description: Learning data analysis, career switcher
        avatar:
          src: https://i.pravatar.cc/120?img=1
    - quote: I'm a developer picking up a completely different skill for fun, and the pacing was exactly right. Never too basic, never overwhelming.
      user:
        name: Marcus Bell
        description: Software engineer, learning for a new hobby
        avatar:
          src: https://i.pravatar.cc/120?img=7
    - quote: I loved that a real person was behind the scenes. My agent handled the day-to-day questions, but when I flagged something confusing, it got escalated and someone actually looked at it.
      user:
        name: Diane Kessler
        description: Upskilling in project management
        avatar:
          src: https://i.pravatar.cc/120?img=3
    - quote: I have almost no free time, so being able to pause for two weeks and pick up exactly where I left off made all the difference.
      user:
        name: Yusuf Demir
        description: Learning to code, working parent
        avatar:
          src: https://i.pravatar.cc/120?img=5
    - quote: The progress dashboard kept me honest. Seeing exactly what I'd mastered made it easy to keep going instead of losing track.
      user:
        name: Elena Torres
        description: Learning UX design
        avatar:
          src: https://i.pravatar.cc/120?img=8
    - quote: I went in as a total beginner with no jargon and no assumptions. My agent explained everything at my level and only sped up once I was ready.
      user:
        name: Grace Okonkwo
        description: First technical course, non-technical background
        avatar:
          src: https://i.pravatar.cc/120?img=9
    - quote: As someone already in tech, I appreciated that I could skip straight to the advanced material instead of sitting through the basics again.
      user:
        name: Daniel Ho
        description: Senior engineer, deepening a specialization
        avatar:
          src: https://i.pravatar.cc/120?img=11
    - quote: My agent flagged that I kept struggling with the same type of exercise and suggested extra practice before I even realized the pattern myself.
      user:
        name: Amara Boateng
        description: Learning marketing analytics
        avatar:
          src: https://i.pravatar.cc/120?img=10
    - quote: Finishing with an actual certificate I could put on my resume made the whole thing feel worth it, not just something I dabbled in.
      user:
        name: Tom Reilly
        description: Career changer into IT support
        avatar:
          src: https://i.pravatar.cc/120?img=12
cta:
  title: Ready to start learning?
  description: Join learners of every background building real skills with an AI agent guiding the way and a human team behind it.
  links:
    - label: Start learning free
      to: '/signup'
      trailingIcon: i-lucide-arrow-right
    - label: View pricing
      to: '/pricing'
      variant: subtle
