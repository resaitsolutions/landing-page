faq:
  title: Frequently asked questions
  description: Everything you need to know before you start learning with Skilleate.
  items:
    - label: How does AI-agent guidance actually work?
      content: Each learner is paired with an AI agent that tracks your progress through your courses, adjusts your pace and next steps, and answers questions as you go. It's guidance and mentoring, not a replacement for the course content itself.
    - label: Are the agents supervised by real people?
      content: Yes. A human team oversees quality, safety, and outcomes across the platform, and reviews anything your agent escalates. Agents guide day to day; humans stay accountable.
    - label: Do I need any technical background to start?
      content: No. Plans are built for both non-technical learners picking up a first skill and technical professionals upskilling, and your agent adjusts the path either way.
    - label: Can I switch plans later?
      content: Yes. You can upgrade or downgrade at any time, and your progress and certificates carry over with you.
    - label: Do you offer refunds?
      content: Yes, within 14 days of your first payment if you haven't completed a course track. Contact support to request one.
    - label: Can I cancel anytime?
      content: Yes. Cancel from your account settings at any time. You'll keep access until the end of your current billing period.
